name: Deployment Ex input Reusable workflow
on: 
  push:
    branches: 
      main
jobs:
  lint: 
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build step
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: 
            name: dist-file
            path: dist

  deploy:
    needs: test
    uses: ./.github/workflows/Reusableworkflow.yml
    with:
      artifact-name: dist-file # Chỉ định input cho reusable workflow ádsadsadd
